[workspace]
resolver = "3"
members = [
    "crates/syncback-core",
    "crates/syncback",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# unwrap_used/panic kept default (allow) for now — adding them as warn produced
# 1000+ findings (mostly tests). Tighten in a follow-up sweep.

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
ciborium = "0.2"
toml = "0.8"

# Crypto
blake3 = "1"
chacha20poly1305 = "0.5"
chacha20 = "0.9"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"

# Erasure coding
raptorq = "2"

# Compression
zstd = "0.13"

# Database
redb = "2"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# P2P networking
async-trait = "0.1"
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "request-response",
    "identify",
    "kad",
    "relay",
    "dcutr",
    "macros",
] }
futures = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Random number generation
# Pinned to 0.9 (not 0.10): rand 0.10 requires rand_core 0.9, but
# ed25519-dalek 2 still pins rand_core 0.6.4. Bump to 0.10 once
# ed25519-dalek 3.0 leaves pre-release.
rand = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# BIP39 mnemonic
bip39 = "2"

# Testing
tempfile = "3"

# File-system watching
notify = "8"
ignore = "0.4"

# System
libc = "0.2"

# HTTP client (metrics push)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }

# HTTP server (web API)
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Filesystem sandboxing
cap-std = "4"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Internal
syncback-core = { path = "crates/syncback-core" }
