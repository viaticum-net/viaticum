[workspace]
resolver = "2"
members = [
    "crates/syncback-core",
    "crates/syncback",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
toml = "0.8"

# Crypto
blake3 = "1"
chacha20poly1305 = "0.5"
chacha20 = "0.9"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"

# Erasure coding
raptorq = "2"

# Compression
zstd = "0.13"

# Database
redb = "2"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# P2P networking
iroh = "0.96"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Random number generation
rand = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# BIP39 mnemonic
bip39 = "2"

# Testing
tempfile = "3"

# File-system watching
notify = "6"

# System
libc = "0.2"

# HTTP client (metrics push)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Internal
syncback-core = { path = "crates/syncback-core" }
