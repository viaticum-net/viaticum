[workspace]
resolver = "3"
members = [
    "crates/viaticum-core",
    "crates/viaticum",
    "crates/viaticum-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "deny"
# Surface pub items never used cross-crate → candidates for pub(crate)/dead-code.
# Started as "warn" for a one-time harvest sweep (2026-07-06); promote to "deny"
# after the inventory is triaged and cleaned. dead_code (warn by default) then
# catches the truly-unused once visibility is narrowed. Class-2 wiring-gaps
# (test-only-reachable) are NOT caught by any lint — see arch machinery review.
unreachable_pub = "warn"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# unwrap_used/panic kept default (allow) for now — adding them as warn produced
# 1000+ findings (mostly tests). Tighten in a follow-up sweep.

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
ciborium = "0.2"
toml = "1"

# Crypto
blake3 = "1"
chacha20poly1305 = "0.10"
chacha20 = "0.10"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
# Already in the tree via ed25519-dalek / x25519-dalek; direct dep for Zeroizing key buffers.
zeroize = "1"

# Erasure coding
raptorq = "2"

# Compression
zstd = "0.13"

# Database
redb = "4"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# P2P networking
async-trait = "0.1"
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "request-response",
    "identify",
    "kad",
    "relay",
    "dcutr",
    "macros",
] }
futures = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Data parallelism (offline sim harness only — deterministic per-seed fan-out).
rayon = "1"

# Random number generation
# Pinned to 0.9 (not 0.10): rand 0.10 requires rand_core 0.9, but
# ed25519-dalek 2 still pins rand_core 0.6.4. Bump to 0.10 once
# ed25519-dalek 3.0 leaves pre-release.
rand = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# BIP39 mnemonic
bip39 = "2"

# Testing
tempfile = "3"

# File-system watching
notify = "8"
ignore = "0.4"

# System
libc = "0.2"

# HTTP client (metrics push)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }

# HTTP server (web API)
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Filesystem sandboxing
cap-std = "4"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Internal
viaticum-core = { path = "crates/viaticum-core" }

# Test/dev speed (2026-09-26): numeric sims and erasure/crypto are 10-50x slower
# unoptimized. Optimize all dependencies (compiled once, cached) and the simulator;
# workspace daemon/core crates stay debug for fast incremental rebuilds. Overflow
# checks and debug assertions stay on (they are profile-level, not opt-level).
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.viaticum-sim]
opt-level = 3

# raptorq's debug assertions make its encoding-plan generation cubic in K (K = 1024: 9 s,
# K = 2048: 35-70 s; release: 4 ms at 1024). The plan tests of R1-d-b (K = 4096, 16384) need it
# as fast as in production; the library's checks are not what our tests exercise.
[profile.dev.package.raptorq]
opt-level = 3
debug-assertions = false
