services:
  node-00:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamma-node-00
    hostname: node-00
    volumes:
      - ../../target/release/viaticum:/usr/local/bin/viaticum:ro
      - node-00-data:/home/viaticum/.viaticum
      - node-00-files:/data/files
    networks:
      - gamma-net

