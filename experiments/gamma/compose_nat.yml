services:
  # iroh relay server (dev mode, HTTP on port 3340).
  # Multi-homed: reachable from both private networks (simulates "the internet").
  relay:
    image: n0computer/iroh-relay:latest
    container_name: nat-relay
    hostname: nat-relay
    command: ["--dev"]
    networks:
      nat-net-a:
        ipv4_address: 192.168.10.200
      nat-net-b:
        ipv4_address: 192.168.20.200
      nat-outer:
        ipv4_address: 10.0.0.10

  # NAT router: bridges net-a and net-b via outer network with MASQUERADE.
  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: nat-router
    hostname: nat-router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      nat-net-a:
        ipv4_address: 192.168.10.100
      nat-net-b:
        ipv4_address: 192.168.20.100
      nat-outer:
        ipv4_address: 10.0.0.100

  # Nodes on net-a (owner + holder)
  node-01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat-node-01
    hostname: node-01
    volumes:
      - ../../target/release/syncback:/usr/local/bin/syncback:ro
      - nat-node-01-data:/home/syncback/.syncback
      - nat-node-01-files:/data/files
    networks:
      nat-net-a:
        ipv4_address: 192.168.10.10

  node-02:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat-node-02
    hostname: node-02
    volumes:
      - ../../target/release/syncback:/usr/local/bin/syncback:ro
      - nat-node-02-data:/home/syncback/.syncback
      - nat-node-02-files:/data/files
    networks:
      nat-net-a:
        ipv4_address: 192.168.10.11

  # Nodes on net-b (holders behind different NAT)
  node-03:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat-node-03
    hostname: node-03
    volumes:
      - ../../target/release/syncback:/usr/local/bin/syncback:ro
      - nat-node-03-data:/home/syncback/.syncback
      - nat-node-03-files:/data/files
    networks:
      nat-net-b:
        ipv4_address: 192.168.20.10

  node-04:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat-node-04
    hostname: node-04
    volumes:
      - ../../target/release/syncback:/usr/local/bin/syncback:ro
      - nat-node-04-data:/home/syncback/.syncback
      - nat-node-04-files:/data/files
    networks:
      nat-net-b:
        ipv4_address: 192.168.20.11

networks:
  nat-net-a:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  nat-net-b:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
  nat-outer:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24

volumes:
  nat-node-01-data:
  nat-node-01-files:
  nat-node-02-data:
  nat-node-02-files:
  nat-node-03-data:
  nat-node-03-files:
  nat-node-04-data:
  nat-node-04-files:
