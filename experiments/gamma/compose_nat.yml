services:
  # Nodes on net-a (owner + holder).
  # Both networks have internet access for iroh's public relay/DNS discovery.
  node-01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat-node-01
    hostname: node-01
    volumes:
      - ../../target/release/viaticum:/usr/local/bin/viaticum:ro
      - nat-node-01-data:/home/viaticum/.viaticum
      - nat-node-01-files:/data/files
    networks:
      - nat-net-a

  node-02:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat-node-02
    hostname: node-02
    volumes:
      - ../../target/release/viaticum:/usr/local/bin/viaticum:ro
      - nat-node-02-data:/home/viaticum/.viaticum
      - nat-node-02-files:/data/files
    networks:
      - nat-net-a

  # Nodes on net-b (holders behind different network)
  node-03:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat-node-03
    hostname: node-03
    volumes:
      - ../../target/release/viaticum:/usr/local/bin/viaticum:ro
      - nat-node-03-data:/home/viaticum/.viaticum
      - nat-node-03-files:/data/files
    networks:
      - nat-net-b

  node-04:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nat-node-04
    hostname: node-04
    volumes:
      - ../../target/release/viaticum:/usr/local/bin/viaticum:ro
      - nat-node-04-data:/home/viaticum/.viaticum
      - nat-node-04-files:/data/files
    networks:
      - nat-net-b

networks:
  nat-net-a:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  nat-net-b:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24

volumes:
  nat-node-01-data:
  nat-node-01-files:
  nat-node-02-data:
  nat-node-02-files:
  nat-node-03-data:
  nat-node-03-files:
  nat-node-04-data:
  nat-node-04-files:
