services:
  node-a:
    build:
      context: ../..
      dockerfile: experiments/docker/Dockerfile
    container_name: viaticum-node-a
    hostname: node-a
    volumes:
      - node-a-data:/home/viaticum/.viaticum
      - node-a-files:/data/files
    networks:
      - viaticum-net

  node-b:
    build:
      context: ../..
      dockerfile: experiments/docker/Dockerfile
    container_name: viaticum-node-b
    hostname: node-b
    volumes:
      - node-b-data:/home/viaticum/.viaticum
      - node-b-files:/data/files
    networks:
      - viaticum-net

  node-c:
    build:
      context: ../..
      dockerfile: experiments/docker/Dockerfile
    container_name: viaticum-node-c
    hostname: node-c
    volumes:
      - node-c-data:/home/viaticum/.viaticum
      - node-c-files:/data/files
    networks:
      - viaticum-net

  node-d:
    build:
      context: ../..
      dockerfile: experiments/docker/Dockerfile
    container_name: viaticum-node-d
    hostname: node-d
    volumes:
      - node-d-data:/home/viaticum/.viaticum
      - node-d-files:/data/files
    networks:
      - viaticum-net

  node-e:
    build:
      context: ../..
      dockerfile: experiments/docker/Dockerfile
    container_name: viaticum-node-e
    hostname: node-e
    volumes:
      - node-e-data:/home/viaticum/.viaticum
      - node-e-files:/data/files
    networks:
      - viaticum-net

networks:
  viaticum-net:
    driver: bridge

volumes:
  node-a-data:
  node-a-files:
  node-b-data:
  node-b-files:
  node-c-data:
  node-c-files:
  node-d-data:
  node-d-files:
  node-e-data:
  node-e-files:
