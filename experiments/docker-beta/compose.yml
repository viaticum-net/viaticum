services:
  node-a:
    build:
      context: ../..
      dockerfile: experiments/docker-beta/Dockerfile
    container_name: syncback-beta-node-a
    hostname: node-a
    volumes:
      - node-a-data:/home/syncback/.syncback
      - node-a-files:/data/files
    networks:
      - syncback-net

  node-b:
    build:
      context: ../..
      dockerfile: experiments/docker-beta/Dockerfile
    container_name: syncback-beta-node-b
    hostname: node-b
    volumes:
      - node-b-data:/home/syncback/.syncback
      - node-b-files:/data/files
    networks:
      - syncback-net

  node-c:
    build:
      context: ../..
      dockerfile: experiments/docker-beta/Dockerfile
    container_name: syncback-beta-node-c
    hostname: node-c
    volumes:
      - node-c-data:/home/syncback/.syncback
      - node-c-files:/data/files
    networks:
      - syncback-net

  node-d:
    build:
      context: ../..
      dockerfile: experiments/docker-beta/Dockerfile
    container_name: syncback-beta-node-d
    hostname: node-d
    volumes:
      - node-d-data:/home/syncback/.syncback
      - node-d-files:/data/files
    networks:
      - syncback-net

  node-e:
    build:
      context: ../..
      dockerfile: experiments/docker-beta/Dockerfile
    container_name: syncback-beta-node-e
    hostname: node-e
    volumes:
      - node-e-data:/home/syncback/.syncback
      - node-e-files:/data/files
    networks:
      - syncback-net

  victoria:
    image: victoriametrics/victoria-metrics:latest
    container_name: syncback-beta-victoria
    ports:
      - "8428:8428"
    volumes:
      - victoria-data:/victoria-metrics-data
    networks:
      - syncback-net

  grafana:
    image: grafana/grafana:latest
    container_name: syncback-beta-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - syncback-net

networks:
  syncback-net:
    driver: bridge

volumes:
  victoria-data:
  grafana-data:
  node-a-data:
  node-a-files:
  node-b-data:
  node-b-files:
  node-c-data:
  node-c-files:
  node-d-data:
  node-d-files:
  node-e-data:
  node-e-files:
